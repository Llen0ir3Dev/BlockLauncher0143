<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1b2a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="block" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a9eff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e5f9e;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="32" fill="url(#bg)"/>
  <g transform="translate(64, 48)">
    <!-- Minecraft-style block -->
    <polygon points="128,0 256,48 256,144 128,192 0,144 0,48" fill="url(#block)" stroke="#0d1b2a" stroke-width="2"/>
    <polygon points="128,0 256,48 256,144 128,192" fill="#2d7fd6" opacity="0.6"/>
    <polygon points="128,0 0,48 0,144 128,192" fill="#1a4a8c" opacity="0.6"/>
    <!-- NEXUS text -->
    <text x="128" y="220" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#4a9eff" text-anchor="middle" letter-spacing="2">NEXUS</text>
    <text x="128" y="250" font-family="Arial, sans-serif" font-size="14" fill="#8ab8e8" text-anchor="middle">MCPE</text>
  </g>
</svg>
