name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  linux:
    name: Ubuntu 22.04 x86_64
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libsdl2-dev zlib1g-dev libpng-dev \
            libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev libgl1-mesa-dri \
            glslang-tools python3 file xvfb \
            qemu-user-static \
            fuse libfuse2 \
            wget ca-certificates

      - name: Set up Android NDK (ARM32 guest cross-compiler)
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25c
          add-to-path: true

      - name: Install AppImage tools
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          sudo mv linuxdeploy-x86_64.AppImage /usr/local/bin/linuxdeploy

          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          sudo mv appimagetool-x86_64.AppImage /usr/local/bin/appimagetool

          linuxdeploy --version
          appimagetool --version

      - name: Configure (x86_64 host + ARM32 guest)
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DNEXUS_BUILD_TESTS=ON \
            -DNEXUS_BUILD_RUNTIME=ON \
            -DNEXUS_BUILD_LAUNCHER=ON \
            -DNEXUS_BUILD_APPIMAGE=ON \
            -DNEXUS_BUILD_GUEST_ARM32=ON \
            -DNEXUS_ANDROID_NDK="${{ steps.setup-ndk.outputs.ndk-path }}"

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Verify host binaries are x86_64
        run: |
          set -e
          for b in build/nexus build/nexus-runtime build/nexus-launcher build/compat/arm32/nexus_arm_loader build/compat/arm32/nexus_gfx_host; do
            echo "== $b =="
            file "$b"
            readelf -h "$b" | grep -E "Class|Machine"
            if ! readelf -h "$b" | grep -q "X86-64"; then
              echo "::error::$b was not built for x86_64"
              exit 1
            fi
          done

      - name: Verify ARM32 guest binaries
        run: |
          set -e
          for b in build/guest-arm32/guest_smoke_static build/guest-arm32/nexus_elf_loader build/guest-arm32/nexus_gfx_smoke; do
            echo "== $b =="
            file "$b"
            readelf -h "$b" | grep -E "Class|Machine"
            if ! readelf -h "$b" | grep -q "ARM"; then
              echo "::error::$b was not built for ARM32"
              exit 1
            fi
            echo "-- TLS program header (must be aligned, 0x20) --"
            readelf -l "$b" | grep -i TLS
          done

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Graphics bridge (headless + visible window)
        run: |
          set -e
          bash compat/arm32/tools/run_gfx_smoke.sh \
            build/compat/arm32/nexus_gfx_host qemu-arm \
            build/guest-arm32/nexus_gfx_smoke build/gfx-headless.png
          file build/gfx-headless.png
          xvfb-run -a bash compat/arm32/tools/run_gfx_smoke.sh \
            build/compat/arm32/nexus_gfx_host qemu-arm \
            build/guest-arm32/nexus_gfx_smoke build/gfx-window.png --window
          file build/gfx-window.png

      - name: Upload graphics bridge frames
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-GFX-bridge-frames
          path: |
            build/gfx-headless.png
            build/gfx-window.png
          retention-days: 30

      - name: Build AppImage
        run: |
          cmake --build build --target NEXUS-MCPE-x86_64-appimage -j"$(nproc)"
          ls -la build/appimage/

      - name: Test AppImage (x86_64 + bundled ARM32 runtime)
        run: |
          set -e
          APPIMAGE=$(find build/appimage -name "*.AppImage" | head -1)
          test -n "$APPIMAGE"
          chmod +x "$APPIMAGE"
          file "$APPIMAGE"
          "$APPIMAGE" --version

          echo "-- inspecting AppImage contents --"
          rm -rf squashfs-root
          "$APPIMAGE" --appimage-extract >/dev/null
          for b in nexus-launcher nexus nexus-runtime nexus_arm_loader nexus_elf_inspect nexus_gfx_host; do
            test -x "squashfs-root/usr/bin/$b" || {
              echo "::error::bundled $b missing"; exit 1; }
            file "squashfs-root/usr/bin/$b"
            if ! readelf -h "squashfs-root/usr/bin/$b" | grep -q "X86-64"; then
              echo "::error::$b is not x86_64"; exit 1
            fi
          done
          test -f squashfs-root/usr/bin/qemu-arm-static || {
            echo "::error::bundled qemu-arm-static missing"; exit 1; }
          file squashfs-root/usr/bin/qemu-arm-static
          test -d squashfs-root/usr/share/nexus-mcpe/compat/arm32 || {
            echo "::error::bundled ARM32 guest runtime missing"; exit 1; }
          for g in guest_smoke_static nexus_elf_loader nexus_gfx_smoke; do
            test -f "squashfs-root/usr/share/nexus-mcpe/compat/arm32/$g" || {
              echo "::error::bundled $g missing"; exit 1; }
            file "squashfs-root/usr/share/nexus-mcpe/compat/arm32/$g"
          done

          echo "-- launcher detects no game (and stays honest) --"
          HOME=/tmp/nexus-ci-home squashfs-root/usr/bin/nexus-launcher --detect || true

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-MCPE-x86_64-AppImage
          path: build/appimage/*.AppImage
          retention-days: 30

      - name: Upload ARM32 guest runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-ARM32-guest-runtime
          path: build/guest-arm32/
          retention-days: 30

      - name: Show versions
        if: always()
        run: |
          ./build/nexus version
          ./build/nexus doctor || true

  release:
    name: Create GitHub Release
    needs: linux
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download AppImage artifact
        uses: actions/download-artifact@v4
        with:
          name: NEXUS-MCPE-x86_64-AppImage
          path: release/

      - name: Verify AppImage
        run: |
          ls -la release/
          APPIMAGE=$(find release -name "*.AppImage" | head -1)
          chmod +x "$APPIMAGE"
          "$APPIMAGE" --version

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: release/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
